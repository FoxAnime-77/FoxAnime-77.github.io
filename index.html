
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08060d">

<title>FOX ANIME WALLPAPER</title>
<meta name="description" content="Explore and download HD and 4K anime wallpapers for free.">

<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
    --orange: #ff7900;
    --purple: #a020ff;
    --pink: #e83cff;
    --bg: #08060d;
    --card: #15111d;
    --white: #ffffff;
    --muted: #aaa3b5;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 100px;
}

body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

button, input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

img {
    max-width: 100%;
}

.container {
    width: 92%;
    max-width: 1450px;
    margin: auto;
}

/* HEADER */

header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(8,6,13,.96);
    backdrop-filter: blur(15px);
    border-bottom: 2px solid transparent;
    border-image: linear-gradient(90deg,var(--orange),var(--purple),var(--orange)) 1;
}

.header-inner {
    min-height: 92px;
    width: 94%;
    max-width: 1500px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 210px;
}

.logo img {
    width: 67px;
    height: 67px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid var(--orange);
    box-shadow: 0 0 15px #ff790044;
    background: #100b16;
}

.logo-text {
    font-size: 25px;
    font-weight: 900;
    font-style: italic;
    line-height: 1;
    white-space: nowrap;
}

.logo-text span {
    color: var(--orange);
}

.logo-sub {
    display: block;
    font-size: 9px;
    letter-spacing: 5px;
    color: #ddd;
    margin-top: 6px;
    text-align: center;
}

nav {
    display: flex;
    align-items: center;
    gap: 34px;
}

nav a {
    font-size: 13px;
    color: #ddd;
    transition: .3s;
    position: relative;
}

nav a:hover,
nav a.active {
    color: var(--orange);
}

nav a.active::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 3px;
    background: var(--orange);
    bottom: -15px;
    left: 0;
    box-shadow: 0 0 12px var(--orange);
}

.header-social {
    display: flex;
    align-items: center;
    gap: 12px;
}

.social-icon {
    width: 43px;
    height: 43px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    font-size: 19px;
    font-weight: 800;
    border: 1px solid #42334d;
    background: #100d17;
    transition: .3s;
}

.social-icon:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 18px #a020ff66;
}

.social-icon.whatsapp-icon {
    border-color: #20cf65;
    color: #20cf65;
}

.social-icon.telegram-icon {
    border-color: #159cde;
    color: #159cde;
}

.menu-btn {
    display: none;
    border: 1px solid #493454;
    color: white;
    background: #17101f;
    border-radius: 8px;
    padding: 8px 13px;
    font-size: 23px;
}

/* HERO */

.hero {
    min-height: 510px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    background:
        linear-gradient(90deg,#08060d 5%,rgba(8,6,13,.92) 38%,rgba(8,6,13,.28) 100%),
        url("hero-bg.jpg") center/cover no-repeat;
    border-bottom: 2px solid var(--purple);
}

.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg,#08060d66,transparent 45%);
    pointer-events: none;
}

.hero-content {
    position: relative;
    z-index: 3;
    width: 55%;
    max-width: 720px;
    margin-left: 7%;
    padding: 55px 0;
}

.hero-tag {
    color: #f5dfff;
    letter-spacing: 4px;
    font-size: 12px;
    margin-bottom: 22px;
}

.hero-tag span {
    color: var(--purple);
    font-size: 22px;
    font-weight: 900;
    margin-right: 10px;
}

.hero h1 {
    font-size: clamp(48px,7vw,88px);
    line-height: 1.02;
    font-weight: 900;
    font-style: italic;
    letter-spacing: -3px;
}

.hero h1 .line-one {
    display: block;
    color: #fff;
    font-family: 'Permanent Marker', cursive;
}

.hero h1 .line-two {
    display: block;
    color: var(--orange);
    font-family: 'Permanent Marker', cursive;
    text-shadow: 0 0 25px #ff790044;
}

.hero-description {
    max-width: 490px;
    color: #e0dce5;
    line-height: 1.9;
    font-size: 15px;
    margin: 22px 0 28px;
}

.hero-buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.main-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 26px;
    border-radius: 35px;
    background: linear-gradient(100deg,#ff7900,#ff4b16);
    color: #120900;
    font-size: 13px;
    font-weight: 900;
    box-shadow: 0 0 22px #ff790044;
    transition: .3s;
}

.main-btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 30px #ff790088;
}

.outline-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 13px 26px;
    border-radius: 35px;
    border: 2px solid var(--purple);
    color: #dcaaff;
    font-size: 13px;
    font-weight: 800;
    transition: .3s;
}

.outline-btn:hover {
    background: var(--purple);
    color: white;
    box-shadow: 0 0 22px #a020ff77;
}

.hero-character {
    position: absolute;
    z-index: 2;
    right: 4%;
    bottom: 0;
    width: 39%;
    max-width: 520px;
    height: 96%;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    pointer-events: none;
}

.hero-character img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: bottom;
    filter: drop-shadow(0 0 25px #a020ff55);
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    background: #100c17;
    border-bottom: 1px solid #35233e;
    border-top: 1px solid #35233e;
    padding: 22px 8%;
}

.stat {
    text-align: center;
    border-right: 1px solid #392b45;
}

.stat:last-child {
    border: none;
}

.stat h2 {
    color: var(--orange);
    font-size: 27px;
    font-weight: 900;
}

.stat p {
    color: #aaa;
    font-size: 11px;
}

/* SECTION HEADINGS */

section {
    padding: 65px 0;
}

.section-heading {
    margin-bottom: 30px;
}

.section-heading h2 {
    font-size: clamp(25px,3.5vw,37px);
    font-weight: 900;
    font-style: italic;
    text-transform: uppercase;
}

.section-heading h2 span {
    color: var(--orange);
}

.section-heading p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 5px;
}

.heading-line {
    border-left: 7px solid var(--purple);
    padding-left: 18px;
}

/* CATEGORIES */

.categories {
    display: grid;
    grid-template-columns: repeat(6,minmax(0,1fr));
    gap: 16px;
}

.category-card {
    height: 205px;
    position: relative;
    overflow: hidden;
    border-radius: 13px;
    cursor: pointer;
    background: #17111f;
    border: 1px solid #7134a0;
    transition: .3s;
}

.category-card:nth-child(odd) {
    border-color: var(--orange);
}

.category-card:hover {
    transform: translateY(-7px);
    box-shadow: 0 0 24px #a020ff55;
}

.category-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: .4s;
}

.category-card:hover img {
    transform: scale(1.1);
}

.category-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg,#08060df5 0%,transparent 75%);
}

.category-name {
    position: absolute;
    bottom: 15px;
    left: 8px;
    right: 8px;
    z-index: 2;
    text-align: center;
    font-size: 13px;
    font-weight: 900;
    font-style: italic;
    text-shadow: 0 2px 8px black;
}

.category-arrow {
    position: absolute;
    z-index: 3;
    bottom: 12px;
    right: 9px;
    width: 23px;
    height: 23px;
    display: grid;
    place-items: center;
    border: 1px solid var(--orange);
    color: var(--orange);
    border-radius: 50%;
    font-size: 12px;
}

/* FEATURE BANNER */

.feature {
    position: relative;
    overflow: hidden;
    background:
        linear-gradient(90deg,#100b19 0%,rgba(16,11,25,.92) 55%,rgba(16,11,25,.4)),
        url("hero-bg.jpg") center/cover;
    border-top: 1px solid var(--purple);
    border-bottom: 1px solid var(--orange);
}

.feature-inner {
    min-height: 250px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 25px;
    padding: 30px 5%;
}

.feature-content {
    max-width: 650px;
}

.feature h2 {
    font-size: clamp(25px,4vw,38px);
    font-weight: 900;
    font-style: italic;
}

.feature h2 span {
    color: var(--orange);
}

.feature p {
    color: #c4bdcd;
    font-size: 14px;
    line-height: 1.9;
    margin-top: 12px;
}

.feature img {
    width: 220px;
    height: 220px;
    object-fit: contain;
    filter: drop-shadow(0 0 22px #a020ff55);
}

/* WALLPAPER GALLERY */

#wallpapers {
    scroll-margin-top: 105px;
}

.gallery-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 24px;
}

.gallery-top .section-heading {
    margin: 0;
}

.search-box {
    display: flex;
    align-items: center;
    gap: 10px;
    width: min(420px,100%);
    background: #15121b;
    border: 1px solid #51435c;
    border-radius: 35px;
    padding: 12px 17px;
}

.search-box span {
    font-size: 20px;
    color: #ddd;
}

.search-box input {
    background: transparent;
    border: none;
    outline: none;
    color: white;
    width: 100%;
    font-size: 13px;
}

.search-box input::placeholder {
    color: #aaa;
}

.gallery-tools {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    margin-bottom: 28px;
}

.filter-btn {
    padding: 9px 17px;
    border: 1px solid #403047;
    background: #15111c;
    color: #c9c2d1;
    border-radius: 25px;
    font-size: 11px;
    transition: .25s;
}

.filter-btn:hover,
.filter-btn.active {
    background: linear-gradient(100deg,#a020ff,#d020ff);
    color: white;
    border-color: var(--purple);
    box-shadow: 0 0 15px #a020ff55;
}

.wallpaper-gallery {
    display: grid;
    grid-template-columns: repeat(4,minmax(0,1fr));
    gap: 20px;
}

.wallpaper-card {
    position: relative;
    min-width: 0;
    overflow: hidden;
    padding: 8px;
    border-radius: 14px;
    background: linear-gradient(145deg,#24162f,#100d17);
    border: 1px solid #604070;
    box-shadow: 0 0 16px #a020ff16;
    transition: .3s;
}

.wallpaper-card:hover {
    transform: translateY(-6px);
    border-color: var(--orange);
    box-shadow: 0 0 25px #ff790044;
}

.wallpaper-image-wrap {
    position: relative;
    overflow: hidden;
    border-radius: 9px;
    background: #0b0910;
}

.wallpaper-card img {
    width: 100%;
    height: 255px;
    display: block;
    object-fit: cover;
    transition: .4s;
}

.wallpaper-card:hover img {
    transform: scale(1.04);
}

.quality-tag {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--purple);
    padding: 4px 9px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 800;
}

.wallpaper-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.wallpaper-actions a {
    flex: 1;
    text-align: center;
    padding: 10px 5px;
    border-radius: 7px;
    font-size: 10px;
    font-weight: 800;
    transition: .2s;
}

.preview-btn {
    background: #352440;
    color: white;
}

.download-btn {
    background: var(--orange);
    color: #140a00;
}

.preview-btn:hover,
.download-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.15);
}

.gallery-message {
    grid-column: 1/-1;
    text-align: center;
    color: #bbb;
    padding: 45px 15px;
    line-height: 1.8;
    font-size: 13px;
}

.retry-btn {
    display: inline-block;
    margin-top: 15px;
    border: none;
    border-radius: 25px;
    padding: 10px 22px;
    background: var(--orange);
    color: #111;
    font-weight: 900;
}

/* COMMUNITY */

.community {
    position: relative;
    overflow: hidden;
    background:
        linear-gradient(90deg,#100b19 0%,rgba(16,11,25,.94) 55%,rgba(16,11,25,.65)),
        url("hero-bg.jpg") center/cover;
    border-top: 2px solid var(--purple);
    border-bottom: 2px solid var(--orange);
}

.community-inner {
    min-height: 230px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 35px 5%;
}

.community h2 {
    font-size: clamp(26px,4vw,39px);
    font-weight: 900;
    font-style: italic;
}

.community h2 span {
    color: var(--orange);
}

.community p {
    color: #ccc;
    margin: 10px 0 23px;
    font-size: 14px;
}

.social-links {
    display: flex;
    gap: 13px;
    flex-wrap: wrap;
}

.social-links a {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 22px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 800;
    transition: .3s;
}

.social-links a:hover {
    transform: translateY(-4px);
}

.whatsapp {
    background: #16b83f;
    color: white;
    box-shadow: 0 0 18px #16b83f44;
}

.telegram {
    background: #168bd0;
    color: white;
    box-shadow: 0 0 18px #168bd044;
}

.community-art {
    width: 230px;
    height: 210px;
    object-fit: contain;
    filter: drop-shadow(0 0 25px #a020ff66);
}

/* FOOTER */

footer {
    padding: 28px 5%;
    background: #07060b;
}

.footer-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
}

.footer-logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.footer-logo img {
    width: 55px;
    height: 55px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid var(--orange);
}

.footer-logo strong {
    font-size: 21px;
    font-style: italic;
}

.footer-logo strong span {
    color: var(--orange);
}

.footer-links {
    display: flex;
    gap: 18px;
    color: #bbb;
    font-size: 12px;
}

.footer-links a:hover {
    color: var(--orange);
}

.copyright {
    color: #777;
    font-size: 11px;
    text-align: center;
    margin-top: 22px;
}

/* MOBILE */

@media(max-width:1000px) {
    .header-inner {
        min-height: 75px;
    }

    .logo {
        min-width: auto;
    }

    .logo img {
        width: 55px;
        height: 55px;
    }

    .logo-text {
        font-size: 20px;
    }

    nav {
        gap: 18px;
    }

    .header-social {
        gap: 7px;
    }

    .social-icon {
        width: 36px;
        height: 36px;
        font-size: 15px;
    }

    .categories {
        grid-template-columns: repeat(3,minmax(0,1fr));
    }

    .wallpaper-gallery {
        grid-template-columns: repeat(3,minmax(0,1fr));
    }
}

@media(max-width:700px) {
    .header-inner {
        width: 92%;
        min-height: 72px;
    }

    .logo img {
        width: 48px;
        height: 48px;
    }

    .logo-text {
        font-size: 18px;
    }

    .logo-sub {
        font-size: 7px;
        letter-spacing: 3px;
    }

    .menu-btn {
        display: block;
    }

    nav {
        display: none;
        position: absolute;
        top: 72px;
        left: 0;
        width: 100%;
        padding: 20px;
        background: #100c17;
        border-bottom: 1px solid var(--purple);
        flex-direction: column;
        align-items: stretch;
        gap: 0;
    }

    nav.show {
        display: flex;
    }

    nav a {
        padding: 12px 8px;
        border-bottom: 1px solid #2c2135;
    }

    nav a.active::after {
        display: none;
    }

    .header-social {
        display: none;
    }

    .hero {
        min-height: 470px;
        background-position: center;
    }

    .hero-content {
        width: 72%;
        margin-left: 5%;
        padding: 50px 0;
    }

    .hero h1 {
        font-size: clamp(39px,8vw,60px);
        letter-spacing: -2px;
    }

    .hero-description {
        font-size: 12px;
        max-width: 340px;
    }

    .hero-character {
        right: -8%;
        width: 45%;
        height: 85%;
        opacity: .9;
    }

    .main-btn,
    .outline-btn {
        padding: 11px 16px;
        font-size: 11px;
    }

    section {
        padding: 48px 0;
    }

    .categories {
        grid-template-columns: repeat(3,minmax(0,1fr));
        gap: 11px;
    }

    .category-card {
        height: 145px;
    }

    .category-name {
        font-size: 10px;
        bottom: 12px;
    }

    .category-arrow {
        width: 19px;
        height: 19px;
        font-size: 10px;
        bottom: 8px;
        right: 6px;
    }

    .gallery-top {
        align-items: flex-start;
        flex-direction: column;
    }

    .search-box {
        width: 100%;
    }

    .wallpaper-gallery {
        grid-template-columns: repeat(2,minmax(0,1fr));
        gap: 12px;
    }

    .wallpaper-card img {
        height: 205px;
    }

    .wallpaper-actions a {
        font-size: 9px;
        padding: 9px 3px;
    }

    .feature-inner,
    .community-inner {
        min-height: 0;
        padding: 30px 3%;
    }

    .feature img,
    .community-art {
        width: 145px;
        height: 160px;
    }

    .community h2 {
        font-size: 25px;
    }

    .community p {
        font-size: 12px;
    }

    .social-links a {
        padding: 11px 14px;
        font-size: 10px;
    }
}

@media(max-width:420px) {
    .hero {
        min-height: 420px;
    }

    .hero-content {
        width: 80%;
    }

    .hero-character {
        right: -16%;
        width: 49%;
        opacity: .7;
    }

    .hero h1 {
        font-size: 38px;
    }

    .hero-tag {
        font-size: 9px;
        letter-spacing: 2px;
    }

    .stats {
        padding: 18px 3%;
    }

    .stat h2 {
        font-size: 22px;
    }

    .stat p {
        font-size: 9px;
    }

    .category-card {
        height: 120px;
    }

    .wallpaper-card {
        padding: 5px;
    }

    .wallpaper-card img {
        height: 175px;
    }

    .quality-tag {
        font-size: 8px;
        top: 6px;
        right: 6px;
    }

    .feature-inner,
    .community-inner {
        flex-direction: column;
        text-align: center;
    }

    .feature img,
    .community-art {
        width: 150px;
        height: 140px;
    }

    .social-links {
        justify-content: center;
    }

    .footer-inner {
        justify-content: center;
        text-align: center;
    }

    .footer-links {
        justify-content: center;
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<header>
    <div class="header-inner">

        <a href="#" class="logo">
            <img src="logo.jpg" alt="FOX Anime Logo">
            <div>
                <div class="logo-text"><span>FOX</span> ANIME</div>
                <span class="logo-sub">W A L L P A P E R</span>
            </div>
        </a>

        <button class="menu-btn" onclick="toggleMenu()" aria-label="Open menu">☰</button>

        <nav id="navigation">
            <a href="#" class="active" onclick="closeMenu()">⌂ Home</a>
            <a href="#categories" onclick="closeMenu()">▦ Anime</a>
            <a href="#wallpapers" onclick="closeMenu()">▧ Wallpapers</a>
            <a href="#community" onclick="closeMenu()">ⓘ About</a>
